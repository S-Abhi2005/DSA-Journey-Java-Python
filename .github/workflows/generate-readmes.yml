name: Generate Problem READMEs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-readmes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate README files
        run: |
          python - <<'PY'
          from pathlib import Path

          for d in sorted(Path(".").iterdir()):
              if not d.is_dir() or d.name.startswith("."):
                  continue

              if (d / "README.md").exists():
                  continue

              solutions = sorted([
                  *d.glob("*.java"),
                  *d.glob("*.py")
              ])

              if not solutions:
                  continue

              if "-" in d.name:
                  problem = d.name.split("-", 1)[1].replace("-", " ").title()
              else:
                  problem = d.name

              with (d / "README.md").open("w", encoding="utf-8") as f:
                  f.write(f"# {problem}\n\n")
                  f.write("## Problem\n\n")
                  f.write(f"Practice problem: **{problem}**.\n\n")
                  f.write("## Solutions\n\n")

                  for s in solutions:
                      f.write(f"- [{s.name}](./{s.name})\n")

                  f.write("\n## Notes\n\n")
                  f.write(
                      "This is my personal solution from my "
                      "DSA and LeetCode practice journey.\n"
                  )
          PY

      - name: Commit and push README files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git diff --cached --quiet && exit 0

          git commit -m "Add README files for new LeetCode problems"

          git push